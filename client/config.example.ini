[shuoshuo]
; 识别服务地址：服务就在本机用 127.0.0.1；其他设备填服务器的局域网 IP 或 Tailscale IP
server = http://127.0.0.1:8765
; 访问令牌，和服务端 server/.token 里的一致
token =
; 按住说话的键
;   Windows：capslock / rctrl / ralt / rshift / pause / scrolllock / insert / f1 ~ f24
;   macOS：ralt（右 Option）/ rcmd / rctrl / rshift / fn / f1 ~ f19（CapsLock 在 macOS 上按住检测不准，不支持）
;   留空用各平台默认：Windows capslock，macOS ralt
hotkey =
; 按住不到这么多秒算短按，CapsLock 照常切换大小写
tap_seconds = 0.3
; 去掉句末的句号
strip_trailing_punct = false
; 开始 / 结束录音的提示音
sound = true
; 麦克风常开：蓝牙耳机首字被吞时再打开（代价是系统一直显示麦克风在用）
keep_mic_open = false
; 本机识别服务没开时自动拉起，退出时一并关掉（只有跑服务的那台机器需要，其他设备留空）
; WSL 示例：server_cmd = wsl.exe -d Ubuntu -- /home/you/shuoshuo/server/run_server.sh
server_cmd =
; 仅 macOS：结果怎么打到光标处
;   auto：当前是拼音等输入法时用剪贴板 + ⌘V（粘完还原剪贴板），否则直接按 Unicode 字符注入
;   type：总是直接注入；paste：总是粘贴
mac_inject = auto
